steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_GA_ID=$$NEXT_PUBLIC_GA_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/iwamaki-app-portfolio'
      - '.'
    secretEnv: ['NEXT_PUBLIC_GA_ID']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/iwamaki-app-portfolio']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'iwamaki-app-portfolio'
      - '--image'
      - 'gcr.io/$PROJECT_ID/iwamaki-app-portfolio'
      - '--region'
      - 'asia-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/iwamaki-app-portfolio'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_GA_ID/versions/latest
      env: 'NEXT_PUBLIC_GA_ID'

serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/cloudbuild-portfolio@$PROJECT_ID.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY
