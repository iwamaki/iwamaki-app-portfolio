<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f7f3eb"/>

  <!-- Pattern 1: ミニマルリスト型 -->
  <!-- シンプルなテキストリンクのみ。余白を大きくとった控えめなデザイン -->

  <!-- Title (控えめに) -->
  <text x="400" y="180" font-family="Georgia, serif" font-size="24" fill="#6b5a47" text-anchor="middle" letter-spacing="4">
    iwamaki.app
  </text>

  <!-- 薄い区切り線 -->
  <line x1="350" y1="210" x2="450" y2="210" stroke="#c9bba8" stroke-width="1"/>

  <!-- ナビゲーションリンク（縦並び） -->
  <g font-family="Georgia, serif" font-size="16" fill="#8b7355" text-anchor="middle">
    <text x="400" y="280">Apps</text>
    <text x="400" y="320">Games</text>
    <text x="400" y="360">Blog</text>
    <text x="400" y="400">Works</text>
    <text x="400" y="440">Contact</text>
  </g>

  <!-- 各リンクの下に薄い点線 -->
  <g stroke="#d4c5b0" stroke-width="1" stroke-dasharray="2,4">
    <line x1="360" y1="290" x2="440" y2="290"/>
    <line x1="360" y1="330" x2="440" y2="330"/>
    <line x1="360" y1="370" x2="440" y2="370"/>
    <line x1="360" y1="410" x2="440" y2="410"/>
  </g>

  <!-- フッター -->
  <text x="400" y="560" font-family="Georgia, serif" font-size="11" fill="#a99b8a" text-anchor="middle">
    © 2025
  </text>

  <!-- デザイン説明ラベル -->
  <rect x="20" y="20" width="200" height="30" fill="#e8e0d4" rx="4"/>
  <text x="30" y="40" font-family="sans-serif" font-size="12" fill="#6b5a47">
    Pattern 1: ミニマルリスト型
  </text>

  <!-- 特徴メモ -->
  <g font-family="sans-serif" font-size="10" fill="#8b7355">
    <text x="600" y="500">特徴:</text>
    <text x="600" y="515">・最もシンプル</text>
    <text x="600" y="530">・余白を活かしたデザイン</text>
    <text x="600" y="545">・拡張性が高い</text>
    <text x="600" y="560">・伝統的な雰囲気</text>
  </g>
</svg>
